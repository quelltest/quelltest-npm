name: Bug report
description: A finding, generated test, verification result or command that is wrong
title: "fix(scope): "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: quelltest version
      description: Output of `npx quell --version`
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scan (false positive/negative), generate, verify, gate, mocks, mcp, cli, docs]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Smallest code that shows it
      description: A few lines of source (and the test, if relevant). No secrets or private code.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Node version and OS
