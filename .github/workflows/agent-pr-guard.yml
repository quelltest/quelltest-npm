name: "Agent: PR guard"

# Catches the mistakes that cost the most time: a pull request that targets another branch than the default (merging it
# never reaches main and never closes its issues), a description with no linked issue, and a source change with no
# CHANGELOG entry. The base-branch check fails the run; the others are warnings.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Base branch is the default branch
        env:
          BASE: ${{ github.base_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE" != "$DEFAULT" ]; then
            echo "::error title=Stacked pull request::This pull request targets '$BASE', not '$DEFAULT'. Merging it will not reach $DEFAULT and will not close the issues it mentions. Retarget it, or merge the base pull request first and retarget this one."
            exit 1
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body ?? '';
            if (!/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#\d+/i.test(body)) {
              core.warning('No linked issue: add "Closes #123" (or "Refs #123") to the description.');
            }
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const names = files.map((file) => file.filename);
            const touchesSource = names.some((name) => name.startsWith('src/'));
            if (touchesSource && !names.includes('CHANGELOG.md')) core.warning('src/ changed but CHANGELOG.md did not: add an entry if the change is user-visible.');
            const touchesTests = names.some((name) => name.startsWith('test/') || name.startsWith('eval/'));
            if (touchesSource && !touchesTests) core.warning('src/ changed but no test or eval fixture did.');
            const text = `${pr.title}\n${body}`;
            if (/co-authored-by:|generated with/i.test(text)) core.warning('The description contains an attribution line (Co-Authored-By / Generated with); this repo does not use them.');
