name: "Agent: triage and labels"

# Deterministic housekeeping, no secrets needed: label new issues from their conventional-commit title, assign the
# maintainer, and label pull requests from the paths they touch. Missing labels are created.

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = /^(feat|fix|docs|test|chore|design|refactor|perf)(?:\(([^)]+)\))?!?:/.exec(issue.title);
            if (!match) return core.info('title is not a conventional-commit title; nothing to label');
            const byType = { feat: 'enhancement', fix: 'bug', docs: 'documentation', test: 'testing', chore: 'chore', design: 'enhancement', refactor: 'tech-debt', perf: 'performance' };
            const wanted = new Set([byType[match[1]]]);
            const scope = match[2]?.split(/[,/ ]+/)[0]?.toLowerCase();
            if (scope && /^[a-z][a-z0-9-]{1,24}$/.test(scope)) wanted.add(scope);
            const { owner, repo } = context.repo;
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((label) => label.name));
            const labels = [...wanted].filter((name) => existing.has(name) || name === byType[match[1]]);
            for (const name of labels) {
              if (!existing.has(name)) await github.rest.issues.createLabel({ owner, repo, name, color: 'ededed' }).catch(() => {});
            }
            if (labels.length) await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
            if (!issue.assignees.length) {
              const assignee = process.env.DEFAULT_ASSIGNEE || owner;
              await github.rest.issues.addAssignees({ owner, repo, issue_number: issue.number, assignees: [assignee] }).catch((error) => core.warning(`could not assign ${assignee}: ${error.message}`));
            }
        env:
          DEFAULT_ASSIGNEE: ${{ vars.DEFAULT_ASSIGNEE }}

  pull-request:
    # Pull requests from forks get a read-only token, so labelling them would fail.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const rules = [
              [/^src\/(scan|files|ast)\.js$/, 'scan'],
              [/^src\/(generator|synthesize|runner|unit|routes)\.js$/, 'generate'],
              [/^src\/(verification|mutate|handoff|mocks|backup)\.js$/, 'verify'],
              [/^src\/gate\.js$/, 'gate'],
              [/^src\/mcp\.js$/, 'mcp'],
              [/^src\/contract\.js$/, 'dependencies'],
              [/^src\/(cli|cli-args)\.js$/, 'cli'],
              [/^(docs\/|README\.md|CHANGELOG\.md)/, 'documentation'],
              [/^(test\/|eval\/)/, 'testing'],
              [/^\.github\//, 'ci'],
            ];
            const wanted = new Set();
            for (const file of files) for (const [pattern, label] of rules) if (pattern.test(file.filename)) wanted.add(label);
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((label) => label.name));
            for (const name of wanted) if (!existing.has(name)) await github.rest.issues.createLabel({ owner, repo, name, color: 'ededed' }).catch(() => {});
            if (wanted.size) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [...wanted] });
