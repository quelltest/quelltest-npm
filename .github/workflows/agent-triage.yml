name: "Agent: label pull requests"

# Deterministic housekeeping, no secrets needed: label pull requests from the paths they touch. Missing labels are
# created. Issues are labelled by agent-triage-issues.yml, a separate workflow, so neither lists the other as skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pull-request:
    # Pull requests from forks get a read-only token, so labelling them would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const rules = [
              [/^src\/(scan|files|ast)\.js$/, 'scan'],
              [/^src\/(generator|synthesize|runner|unit|routes)\.js$/, 'generate'],
              [/^src\/(verification|mutate|handoff|mocks|backup)\.js$/, 'verify'],
              [/^src\/gate\.js$/, 'gate'],
              [/^src\/mcp\.js$/, 'mcp'],
              [/^src\/contract\.js$/, 'dependencies'],
              [/^src\/(cli|cli-args)\.js$/, 'cli'],
              [/^(docs\/|README\.md|CHANGELOG\.md)/, 'documentation'],
              [/^(test\/|eval\/)/, 'testing'],
              [/^\.github\//, 'ci'],
            ];
            const wanted = new Set();
            for (const file of files) for (const [pattern, label] of rules) if (pattern.test(file.filename)) wanted.add(label);
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((label) => label.name));
            for (const name of wanted) if (!existing.has(name)) await github.rest.issues.createLabel({ owner, repo, name, color: 'ededed' }).catch(() => {});
            if (wanted.size) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [...wanted] });
