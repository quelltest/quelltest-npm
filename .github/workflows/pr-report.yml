name: Quelltest PR report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run quelltest on this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node src/cli.js find src --diff "origin/$BASE_REF" --json > quelltest-report.json
      - name: Render report
        run: node scripts/pr-report.mjs quelltest-report.json > quelltest-report.md
      - name: Publish to job summary
        run: cat quelltest-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: quelltest-report
          path: |
            quelltest-report.json
            quelltest-report.md
      - name: Comment on the pull request
        # Fork pull requests get a read-only token; the job summary above still has the report.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- quelltest-report -->';
            const body = `${marker}\n${fs.readFileSync('quelltest-report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      # Last, so the report, artifact and comment are published even when the gate fails.
      - name: Gate against weakened tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          node src/cli.js gate --diff "origin/$BASE_REF" > quelltest-gate.txt
          code=$?
          { echo '### Test gate'; echo '```'; cat quelltest-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat quelltest-gate.txt
          exit "$code"
