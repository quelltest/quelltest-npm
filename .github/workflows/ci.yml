name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect-python
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect-python.outputs.has_python == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff flake8
        if: steps.detect-python.outputs.has_python == 'true'
      - run: ruff check .
        if: steps.detect-python.outputs.has_python == 'true'
      - run: flake8 .
        if: steps.detect-python.outputs.has_python == 'true'
