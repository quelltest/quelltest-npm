name: "Agent: @claude"

# Answers "@claude ..." in issues, pull requests and review comments (explain code, make a fix on a branch, open a PR).
# Disabled until you set the repository variable CLAUDE_AGENTS_ENABLED=true and the secret ANTHROPIC_API_KEY, and install
# the Claude GitHub app (run `/install-github-app` in Claude Code). See docs/automation.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      vars.CLAUDE_AGENTS_ENABLED == 'true' &&
      (github.event_name == 'issues' ||
       contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          assignee_trigger: "claude"
          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm test:*),Bash(npm run check:*),Bash(node src/cli.js:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
            --append-system-prompt "Follow CLAUDE.md-style rules for this repo: Apache-2.0 only (never MIT); never add Co-Authored-By or any AI attribution to commits or PR text; run npm test and npm run check before proposing a change; write tests for every fix; never commit secrets or token files; do not publish to npm or merge pull requests."
