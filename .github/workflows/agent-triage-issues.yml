name: "Agent: label issues"

# Deterministic housekeeping, no secrets needed: label new issues from their conventional-commit title and assign the
# maintainer. Missing labels are created. This is a separate workflow from the pull-request labeller so that pull requests
# never list it as a skipped check.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = /^(feat|fix|docs|test|chore|design|refactor|perf)(?:\(([^)]+)\))?!?:/.exec(issue.title);
            if (!match) return core.info('title is not a conventional-commit title; nothing to label');
            const byType = { feat: 'enhancement', fix: 'bug', docs: 'documentation', test: 'testing', chore: 'chore', design: 'enhancement', refactor: 'tech-debt', perf: 'performance' };
            const wanted = new Set([byType[match[1]]]);
            const scope = match[2]?.split(/[,/ ]+/)[0]?.toLowerCase();
            if (scope && /^[a-z][a-z0-9-]{1,24}$/.test(scope)) wanted.add(scope);
            const { owner, repo } = context.repo;
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((label) => label.name));
            const labels = [...wanted].filter((name) => existing.has(name) || name === byType[match[1]]);
            for (const name of labels) {
              if (!existing.has(name)) await github.rest.issues.createLabel({ owner, repo, name, color: 'ededed' }).catch(() => {});
            }
            if (labels.length) await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
            if (!issue.assignees.length) {
              const assignee = process.env.DEFAULT_ASSIGNEE || owner;
              await github.rest.issues.addAssignees({ owner, repo, issue_number: issue.number, assignees: [assignee] }).catch((error) => core.warning(`could not assign ${assignee}: ${error.message}`));
            }
        env:
          DEFAULT_ASSIGNEE: ${{ vars.DEFAULT_ASSIGNEE }}
